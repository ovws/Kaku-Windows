name: Windows Installer
on:
  workflow_dispatch:
    inputs:
      portable_release:
        description: Verified portable Release to package
        required: true
        default: windows-v0.21.0-5
        type: string
      version:
        description: Installer version
        required: true
        default: 0.21.0-6
        type: string
permissions:
  contents: read
jobs:
  installer:
    runs-on: windows-latest
    env:
      GH_TOKEN: ${{ github.token }}
      PORTABLE_RELEASE: ${{ inputs.portable_release }}
      INSTALLER_VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - name: Install NSIS
        shell: pwsh
        run: |
          choco install nsis --no-progress -y
          if ($LASTEXITCODE -ne 0) { throw 'NSIS install failed' }
          "${env:ProgramFiles(x86)}\NSIS" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Download and verify portable package
        shell: pwsh
        run: |
          New-Item -ItemType Directory dist | Out-Null
          gh release download $env:PORTABLE_RELEASE --repo $env:GITHUB_REPOSITORY --pattern Kaku-Windows-x64.zip --pattern SHA256SUMS.txt --dir dist
          if ($LASTEXITCODE -ne 0) { throw 'Release download failed' }
          $expected = ((Get-Content dist/SHA256SUMS.txt | Where-Object { $_ -match '  Kaku-Windows-x64.zip$' }) -split '\s+')[0]
          $actual = (Get-FileHash dist/Kaku-Windows-x64.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $expected) { throw 'Portable ZIP checksum mismatch' }
          Expand-Archive dist/Kaku-Windows-x64.zip -DestinationPath dist
      - name: Build installer
        shell: pwsh
        run: |
          python scripts/build_windows_installer.py --stage dist/Kaku-Windows-x64 --output-dir dist/installer --version $env:INSTALLER_VERSION
          if ($LASTEXITCODE -ne 0) { throw 'Installer build failed' }
      - name: Native Windows installer smoke
        shell: pwsh
        run: |
          python scripts/windows/test_installer.py "dist/installer/Kaku-Windows-$env:INSTALLER_VERSION-Setup.exe"
          if ($LASTEXITCODE -ne 0) { throw 'Installer smoke failed' }
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: Kaku-Windows-Installer
          path: |
            dist/installer/*Setup.exe
            dist/installer/SHA256SUMS-installer.txt
          if-no-files-found: error
